name: KDR-CA-AEAD Continuous Integration & Release Build

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Execute Unified Test Suite
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_all_tests.py

      - name: Execute Pytest Code Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest --cov=crypto --cov-report=term-missing

  release-build:
    name: Validate Distribution Packaging
    needs: test-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Distribution Archives & Run Checksum Self-Verification
        run: |
          python scripts/build_distribution.py --ci

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kdr-ca-aead-v1.0.0-release-distribution
          path: release/
          retention-days: 30
