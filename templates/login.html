<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Doctor Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#0f172a,#2563eb);

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

        }

        .loginBox{

            width:420px;

            background:white;

            padding:40px;

            border-radius:15px;

            box-shadow:0px 5px 20px rgba(0,0,0,.3);

        }

        h1{

            text-align:center;

            color:#2563eb;

            margin-bottom:10px;

        }

        h3{

            text-align:center;

            color:#666;

            margin-bottom:30px;

            font-weight:normal;

        }

        input{

            width:100%;

            padding:14px;

            margin:10px 0;

            border-radius:8px;

            border:1px solid #ccc;

            font-size:16px;

        }

        input:focus{

            outline:none;

            border:1px solid #2563eb;

        }

        button{

            width:100%;

            padding:14px;

            margin-top:20px;

            background:#2563eb;

            color:white;

            border:none;

            border-radius:8px;

            font-size:17px;

            cursor:pointer;

        }

        button:hover{

            background:#1d4ed8;

        }

        .footer{

            margin-top:25px;

            text-align:center;

            color:gray;

            font-size:14px;

        }

    </style>

</head>

<body>

<div class="loginBox">

    <h1>SHA Healthcare</h1>

    <h3>Doctor Login</h3>

    <form action="/login" method="POST">

        <input
            type="text"
            name="doctorId"
            placeholder="Doctor ID"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">

            Login

        </button>

    </form>

    <div class="footer">

        SHA-512 Based 256-Bit Block Cellular Automata
        Cryptosystem for Secure Healthcare Systems

    </div>

</div>

</body>

</html>
