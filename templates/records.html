<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Records</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #eef2f7;
            padding: 40px 20px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #3765e8;
            font-size: 36px;
        }

        .dashboardBtn {
            display: inline-block;
            text-decoration: none;
            background: #16a34a;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .dashboardBtn:hover {
            background: #15803d;
        }

        .tableBox {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #3765e8;
            color: white;
            padding: 17px;
            font-size: 17px;
        }

        td {
            padding: 17px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: #f8fafc;
        }

        .actionButtons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* VIEW BUTTON */

        .viewBtn {
            display: inline-block;
            background: #3765e8;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .viewBtn:hover {
            background: #244ed0;
        }

        /* EDIT BUTTON */

        .editBtn {
            display: inline-block;
            background: #f59e0b;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .editBtn:hover {
            background: #d97706;
        }

        /* DELETE BUTTON */

        .deleteForm {
            display: inline;
            margin: 0;
        }

        .deleteBtn {
            display: inline-block;
            background: #dc2626;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .deleteBtn:hover {
            background: #b91c1c;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
            color: #6b7280;
            font-size: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        @media (max-width: 700px) {

            .header {
                flex-direction: column;
                gap: 20px;
            }

            .tableBox {
                overflow-x: auto;
            }

            table {
                min-width: 750px;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>Patient Records</h1>

        <a href="/dashboard" class="dashboardBtn">
            ← Dashboard
        </a>

    </div>


    <!-- PATIENT RECORDS -->

    {% if records %}

    <div class="tableBox">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Patient ID</th>
                    <th>Patient Name</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody>

            {% for record in records %}

                <tr>

                    <!-- DATABASE ID -->

                    <td>
                        {{ record[0] }}
                    </td>


                    <!-- PATIENT ID -->

                    <td>
                        {{ record[1] }}
                    </td>


                    <!-- PATIENT NAME -->

                    <td>
                        {{ record[2] }}
                    </td>


                    <!-- ACTION BUTTONS -->

                    <td>

                        <div class="actionButtons">

                            <!-- VIEW -->

                            <a
                                href="/record/{{ record[0] }}"
                                class="viewBtn"
                            >
                                View
                            </a>


                            <!-- EDIT -->

                            <a
                                href="/edit/{{ record[0] }}"
                                class="editBtn"
                            >
                                Edit
                            </a>


                            <!-- DELETE -->

                            <form
                                action="/delete/{{ record[0] }}"
                                method="POST"
                                class="deleteForm"
                                onsubmit="return confirm('Are you sure you want to delete this patient record? This action cannot be undone.');"
                            >

                                <button
                                    type="submit"
                                    class="deleteBtn"
                                >
                                    Delete
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>


    {% else %}

        <div class="empty">
            No Patient Records Found
        </div>

    {% endif %}

</div>

</body>

</html>
