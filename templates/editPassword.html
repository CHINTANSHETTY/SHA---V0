<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unlock Patient Record</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #eef2f7;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #3765e8;
            margin-bottom: 30px;
        }

        .patientInfo {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .patientInfo p {
            margin: 8px 0;
            font-size: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 17px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #3765e8;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f59e0b;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d97706;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            text-decoration: none;
            color: #3765e8;
            font-weight: bold;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Unlock Patient Record</h1>

    <div class="patientInfo">

        <p>
            <strong>Patient ID:</strong>
            {{ record[1] }}
        </p>

        <p>
            <strong>Patient Name:</strong>
            {{ record[2] }}
        </p>

    </div>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <label>Enter Encryption Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter the password used to encrypt this record"
            required
        >

        <button type="submit">
            Unlock & Edit
        </button>

    </form>

    <a href="/records" class="back">
        ← Back to Patient Records
    </a>

</div>

</body>

</html>
