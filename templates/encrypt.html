<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Encrypt Patient Record</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #eef2f7;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #3765e8;
            margin-bottom: 30px;
            font-size: 40px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 18px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3765e8;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #3765e8;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #244ed0;
        }

        .backButton {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #45a557;
            color: white;
            text-decoration: none;
            border-radius: 9px;
        }

        .message {
            margin-top: 25px;
            padding: 15px;
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
        }

        .cipherBox {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .cipherBox textarea {
            min-height: 150px;
            margin-top: 10px;
            word-break: break-all;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Encrypt Patient Record</h1>

    {% if message %}
    <div class="message">
        {{ message }}
    </div>
    {% endif %}

    <form method="POST">

        <label>Patient ID</label>
        <input
            type="text"
            name="patientId"
            placeholder="Example: P001"
            required
        >

        <label>Patient Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter patient name"
            required
        >

        <label>Age</label>
        <input
            type="number"
            name="age"
            min="1"
            max="150"
            placeholder="Enter age"
            required
        >

        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label>Disease</label>
        <input
            type="text"
            name="disease"
            placeholder="Enter disease/condition"
            required
        >

        <label>Diagnosis</label>
        <textarea
            name="diagnosis"
            placeholder="Enter diagnosis details"
            required
        ></textarea>

        <label>Prescription</label>
        <textarea
            name="prescription"
            placeholder="Enter medicines, dosage and instructions"
            required
        ></textarea>

        <label>Encryption Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter encryption password"
            required
        >

        <button type="submit">
            Encrypt & Save Record
        </button>

    </form>

    {% if cipherText %}

    <div class="cipherBox">

        <h3>Encrypted Cipher Text (Binary)</h3>

        <textarea readonly>{{ cipherText }}</textarea>

    </div>

    {% endif %}

    <a href="/dashboard" class="backButton">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
