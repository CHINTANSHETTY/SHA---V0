<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Decrypted Patient Record</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #eef2f7;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 880px;
            margin: auto;
            background: white;
            padding: 42px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #3ba055;
            margin-bottom: 35px;
            font-size: 40px;
        }

        .success {
            text-align: center;
            background: #dcfce7;
            color: #166534;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        .record label {
            display: block;
            font-weight: bold;
            color: #3765e8;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 7px;
        }

        .value {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 17px;
            min-height: 52px;
            word-wrap: break-word;
        }

        .largeValue {
            min-height: 80px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 40px;
        }

        .btn {
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 9px;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .records {
            background: #3765e8;
        }

        .records:hover {
            background: #244ed0;
        }

        .dashboard {
            background: #45a557;
        }

        .dashboard:hover {
            background: #348544;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 30px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Decrypted Patient Record</h1>

    <div class="success">
        Record Successfully Decrypted
    </div>

    <div class="record">

        <label>Patient ID</label>
        <div class="value">
            {{ patientId }}
        </div>

        <label>Patient Name</label>
        <div class="value">
            {{ name }}
        </div>

        <label>Age</label>
        <div class="value">
            {{ age }}
        </div>

        <label>Gender</label>
        <div class="value">
            {{ gender }}
        </div>

        <label>Disease</label>
        <div class="value">
            {{ disease }}
        </div>

        <label>Diagnosis</label>
        <div class="value largeValue">
            {{ diagnosis }}
        </div>

        <label>Prescription</label>
        <div class="value largeValue">
            {{ prescription }}
        </div>

    </div>

    <div class="buttons">

        <a href="/records" class="btn records">
            ← View Records
        </a>

        <a href="/dashboard" class="btn dashboard">
            🏠 Dashboard
        </a>

    </div>

</div>

</body>

</html>
