<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Details</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#eef2f7;
}

.container{

width:700px;

margin:40px auto;

background:white;

padding:35px;

border-radius:12px;

box-shadow:0px 0px 12px rgba(0,0,0,.15);

}

h1{

text-align:center;

color:#2563eb;

margin-bottom:25px;

}

.info{

margin-bottom:20px;

}

.info label{

font-weight:bold;

display:block;

margin-top:15px;

margin-bottom:5px;

}

.data{

background:#f5f5f5;

padding:12px;

border-radius:8px;

word-wrap:break-word;

}

input{

width:100%;

padding:12px;

margin-top:10px;

border:1px solid #ccc;

border-radius:8px;

font-size:16px;

}

button{

margin-top:25px;

width:100%;

padding:14px;

background:#2563eb;

color:white;

border:none;

border-radius:8px;

font-size:17px;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.back{

display:inline-block;

margin-top:20px;

text-decoration:none;

background:#16a34a;

color:white;

padding:10px 18px;

border-radius:8px;

}

.back:hover{

background:#15803d;

}

</style>

</head>

<body>

<div class="container">

<h1>Patient Details</h1>

<div class="info">

<label>Database Record ID</label>

<div class="data">

{{ record[0] }}

</div>

<label>Patient ID</label>

<div class="data">

{{ record[1] }}

</div>

<label>Patient Name</label>

<div class="data">

{{ record[2] }}

</div>

<label>Encrypted Record</label>

<div class="data">

{{ record[3] }}

</div>

</div>

<form action="/decrypt/{{ record[0] }}" method="POST">

<label>Enter Decryption Password</label>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<button type="submit">

Decrypt Record

</button>

</form>

<a href="/records" class="back">

← Back to Records

</a>

</div>

</body>

</html>
